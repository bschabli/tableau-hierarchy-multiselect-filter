name: Deploy hierarchy filter
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage standalone extension
        run: |
          mkdir -p _site/js _site/css
          cp index.html hierarchy_filter.trex _site/
          cp css/filter.css _site/css/
          cp js/app.js js/core.js js/tableau-connector.js js/tableau.extensions.1.latest.min.js _site/js/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
