<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open-source Tableau hierarchy multi-select filter">
  <title>Tableau Hierarchy Filter – PoC</title>
  <link rel="stylesheet" href="./css/filter.css">
  <!-- Tableau Extensions API is served locally alongside this application. -->
  <script src="./js/tableau.extensions.1.latest.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body class="tableau-worksheet">
  <h1>Hierarchy Multi-Select – PoC</h1>
  <p class="note">Zunächst prüfen wir den Set-Zustand über mehrere Dashboards. Die Wunderbaum-Oberfläche folgt danach.</p>
  <div class="toolbar">
    <button id="all" type="button">Modus: Alle</button>
    <button id="none" type="button">Modus: Keine</button>
    <button id="apply" type="button">Auswahl anwenden</button>
    <button id="reload" type="button">Set neu einlesen</button>
  </div>
  <p id="status" role="status">Initialisierung …</p>
  <div class="metrics"><span id="count">—</span><span id="mode">—</span></div>
  <section id="rows" aria-label="Leaf-IDs"></section>
  <p class="note">Alle/Keine ändern nur den Tableau-Parameter. Die Checkboxen zeigen die Set-Auswahl.</p>
  <details><summary>Diagnoseprotokoll</summary><pre id="debug"></pre></details>
</body>
</html>
