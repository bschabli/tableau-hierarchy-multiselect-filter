<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tableau Hierarchy Multi-Select</title>
  <link rel="stylesheet" href="./css/vendor/wunderbaum.css">
  <link rel="stylesheet" href="./css/filter.css">
  <script src="./js/tableau.extensions.1.latest.min.js"></script>
  <script defer src="./js/vendor/wunderbaum.umd.min.js"></script>
  <script defer src="./js/startup-diagnostics.js"></script>
  <script defer type="module" src="./js/app.js"></script>
</head>
<body class="tableau-worksheet">
  <div class="heading" id="heading" hidden><strong id="filter-title">Hierarchiefilter</strong></div>
  <div class="toolbar">
    <div class="mode-buttons" role="group" aria-label="Filtermodus">
      <button type="button" data-mode="ALLE" aria-pressed="false" disabled>Alle</button>
      <button type="button" data-mode="AUSWAHL" aria-pressed="false" disabled>Auswahl</button>
      <button type="button" data-mode="KEINE" aria-pressed="false" disabled>Keine</button>
    </div>
    <button id="apply" type="button" disabled>Anwenden</button>
    <button id="reload" class="icon-button" type="button" aria-label="Neu einlesen" title="Neu einlesen"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11a9 9 0 1 1 2.6 6.3"/><path d="M3 4v7h7"/></svg></button>
  </div>
  <div class="search-bar">
    <input id="search-query" type="search" autocomplete="off" spellcheck="false"
      placeholder="Suchen …" aria-label="Hierarchie durchsuchen" disabled>
    <div class="search-controls" role="group" aria-label="Such- und Baumansicht">
      <button id="search-only" class="icon-button" type="button" aria-label="Nur Treffer anzeigen"
        aria-pressed="false" title="Nur Treffer anzeigen" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16l-6.5 7.2v5.5l-3 1.7v-7.2L4 5Z"/></svg></button>
      <button id="expand-all" class="icon-button" type="button" aria-label="Alle Zweige aufklappen"
        title="Alle Zweige aufklappen" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 10 5-5 5 5"/><path d="m7 14 5 5 5-5"/></svg></button>
      <button id="collapse-all" class="icon-button" type="button" aria-label="Alle Zweige zuklappen"
        title="Alle Zweige zuklappen" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 5 5 5 5-5"/><path d="m7 19 5-5 5 5"/></svg></button>
    </div>
  </div>
  <p id="status" role="status">Initialisiere ...</p>
  <div class="metrics">
    <span id="count"></span><span id="search-count" role="status" aria-live="polite"></span>
    <span id="mode"></span>
  </div>
  <div id="rows" class="wb-skeleton wb-initializing"></div>
</body>
</html>
